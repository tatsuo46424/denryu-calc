<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ebe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="許容電流">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>html{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>
<title>電線許容電流計算機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* レイアウト: 左に条件パネル(電線の種類・布設条件)、右に結果。結果は「大きな許容電流値＋断面図」→計算の内訳→全サイズ表。スマホでは縦に積む */
:root{
  --bg:#e9ebe7;          /* VVFシースのような灰緑 */
  --panel:#fafaf8;
  --sunk:#e1e4df;
  --ink:#1b2123;
  --mute:#5a6467;
  --line:#cfd4cf;
  --accent:#a24d1c;      /* 銅 */
  --accent-2:#c46a33;
  --accent-soft:#f3e0d2;
  --ok:#2a7648; --ok-soft:#d9eee1;
  --ng:#b3382a; --ng-soft:#f6dad5;
  --warn:#8d600c; --warn-soft:#f5ead0;
  /* 断面図の実物色 */
  --cu:#c8733a; --cu-hi:#e4a06c;
  --c-blk:#2b2f31; --c-wht:#f1f1ec; --c-red:#c43b2f; --c-grn:#2f8a4a; --c-blu:#2f5fa8; --c-yel:#d8b23a;
  --sh-cv:#2d3133; --sh-vv:#b7bab4; --sh-eco:#e4e1d6; --sh-cab:#7c8285; --semi:#555b5e;
  --xs-stroke:#1b2123;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Consolas",monospace;
  --bar-bg:#1b2123; --bar-fg:#e9ebe7; --bar-acc:#f0a270;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131719; --panel:#1b2022; --sunk:#232a2c; --ink:#e6ebe8; --mute:#97a2a4; --line:#2f373a;
    --accent:#e08a55; --accent-2:#f0a270; --accent-soft:#3a2517;
    --ok:#62c48b; --ok-soft:#173424; --ng:#f07565; --ng-soft:#3d1c18; --warn:#e3b54f; --warn-soft:#3a2d12;
    --cu:#d08048; --cu-hi:#eeaa78;
    --c-blk:#0c0e0f; --c-wht:#e9e9e3; --c-red:#d2493c; --c-grn:#3f9d5a; --c-blu:#4d7cc6; --c-yel:#d8b23a;
    --sh-cv:#0f1213; --sh-vv:#9a9e98; --sh-eco:#c9c6bb; --sh-cab:#5f6568; --semi:#3b4144;
    --xs-stroke:#8e999c; --bar-bg:#2b3336; --bar-fg:#e6ebe8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131719; --panel:#1b2022; --sunk:#232a2c; --ink:#e6ebe8; --mute:#97a2a4; --line:#2f373a;
  --accent:#e08a55; --accent-2:#f0a270; --accent-soft:#3a2517;
  --ok:#62c48b; --ok-soft:#173424; --ng:#f07565; --ng-soft:#3d1c18; --warn:#e3b54f; --warn-soft:#3a2d12;
  --cu:#d08048; --cu-hi:#eeaa78;
  --c-blk:#0c0e0f; --c-wht:#e9e9e3; --c-red:#d2493c; --c-grn:#3f9d5a; --c-blu:#4d7cc6; --c-yel:#d8b23a;
  --sh-cv:#0f1213; --sh-vv:#9a9e98; --sh-eco:#c9c6bb; --sh-cab:#5f6568; --semi:#3b4144;
  --xs-stroke:#8e999c; --bar-bg:#2b3336; --bar-fg:#e6ebe8;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
.app{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ヘッダー */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:8px 16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;flex:none}
.brand h1{font-size:1.35rem;font-weight:900;letter-spacing:.02em}
.brand .sub{margin:0;color:var(--mute);font-size:.8rem}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* 2カラム */
.layout{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.cond{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
@media (max-width:860px){.cond{position:static}}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:.95rem;font-weight:700;margin-bottom:10px}

/* 入力部品 */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.78rem;font-weight:700;color:var(--mute);letter-spacing:.06em}
.lbl .hint{font-weight:500;letter-spacing:0;color:var(--accent)}
select,input[type=number],input[type=text]{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:16px}
select{cursor:pointer}
.typepick{display:flex;flex-direction:column;gap:10px}
.tgroup .gname{font-size:.72rem;color:var(--mute);margin-bottom:4px}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:.85rem;font-weight:700;line-height:1.3}
.tchip i{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid var(--xs-stroke)}
.tchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.tname{font-size:.8rem;color:var(--mute);margin-top:2px}
.seg{display:flex;flex-wrap:wrap;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1 1 auto;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:700;color:var(--mute);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.stepper{display:flex;gap:6px}
.stepper input{text-align:center;font-family:var(--f-num)}
.stepper button{flex:none;width:42px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;font-size:1.1rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer;font-family:var(--f-num)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.small{font-size:.78rem;color:var(--mute)}

/* 結果ヒーロー */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
@media (max-width:520px){.hero{grid-template-columns:minmax(0,1fr)}.xsec{justify-self:center}}
.eyebrow{font-size:.8rem;color:var(--mute);font-weight:700;letter-spacing:.04em}
.big{display:flex;align-items:baseline;gap:6px;line-height:1;margin:8px 0 6px}
.big .v{font-family:var(--f-num);font-weight:700;font-size:clamp(3.2rem,9vw,5rem);letter-spacing:-.03em;color:var(--accent)}
.big .u{font-family:var(--f-num);font-size:1.6rem;font-weight:700;color:var(--mute)}
.r-sub{font-size:.85rem;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--mute)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ng{background:var(--ng-soft);color:var(--ng)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.cu{background:var(--accent-soft);color:var(--accent)}
.xsec{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.xsec svg{width:132px;height:132px;background:var(--sunk);border-radius:50%}
.xsec figcaption{font-size:.7rem;color:var(--mute)}

/* 計算の内訳 */
.steps{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:0;margin:0;padding:0;list-style:none}
.steps li{display:contents}
.steps .op,.steps .desc,.steps .val{padding:9px 0;border-top:1px solid var(--line)}
.steps li:first-child>*{border-top:0}
.steps .op{font-family:var(--f-num);font-weight:700;color:var(--accent);font-size:1.05rem}
.steps .desc{min-width:0}
.steps .desc b{font-weight:700}
.steps .desc small{display:block;color:var(--mute);font-size:.78rem}
.steps .val{font-family:var(--f-num);font-weight:700;text-align:right;padding-left:12px;white-space:nowrap}
.steps li.total>*{border-top:2px solid var(--ink)}
.steps li.total .val{color:var(--accent);font-size:1.15rem}

/* 表 */
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.74rem;color:var(--mute);font-weight:700;background:var(--sunk);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
td.jp{font-family:var(--f-body)}
tr.sel td{background:var(--accent-soft);font-weight:700}
tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.pick td{background:var(--ok-soft);font-weight:700}
tr.pick td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td.dim{color:var(--mute)}
.thgroup th{background:var(--panel);text-align:center;border-bottom:0}

/* 選定 */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .k{font-size:.74rem;color:var(--mute);font-weight:700}
.kv .v{font-family:var(--f-num);font-size:1.5rem;font-weight:700;line-height:1.2}
.kv .v small{font-size:.9rem;color:var(--mute);margin-left:3px}
.kv .d{font-size:.78rem;color:var(--mute)}
.kv.main .v{color:var(--ok);font-size:1.9rem}
.kv.bad .v{color:var(--ng)}

.notes{font-size:.85rem;color:var(--mute)}
.notes p{margin:0 0 6px}
.notes b{color:var(--ink)}
.foot{margin-top:24px;font-size:.75rem;color:var(--mute);max-width:70ch}
.foot p{margin:0 0 4px}
.check{display:flex;align-items:center;gap:8px;font-size:.85rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.big .v{transition:color .2s}}
body{margin:0}
/* 電気計算 */
.toolmenu{display:flex;flex-direction:column;gap:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 24px);overflow:auto}
.toolmenu[hidden]{display:none}
.tool-list{display:flex;flex-direction:column;gap:2px}
.tool-list .tg{font-size:.72rem;color:var(--mute);font-weight:700;letter-spacing:.06em;margin:10px 0 2px}
.tool-list .tg:first-child{margin-top:0}
.tool-list button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:.88rem;color:var(--ink)}
.tool-list button:hover{background:var(--sunk)}
.tool-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
#tool-sel{display:none}
.toolmenu > .lbl{display:none}
@media (max-width:860px){
  .toolmenu{position:static;max-height:none}
  .tool-list{display:none}
  #tool-sel{display:block}
  .toolmenu > .lbl{display:block}
}
.tool-head{margin-bottom:14px}
.tool-title{font-size:1.2rem;font-weight:900;margin:2px 0 4px}
.tool-head .small{margin:0;max-width:70ch}
.tool-fig{display:flex;justify-content:center}
.tool-fig svg{max-width:100%;height:auto}
.fig-t{font-family:var(--f-num);font-size:12px;fill:var(--ink)}
.fig-m{font-size:11px;fill:var(--mute)}
.kv .v.ok{color:var(--ok)} .kv .v.ng{color:var(--ng)} .kv .v.cu{color:var(--accent)}
.kv.hl{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:-8px -10px}
.field .unit{font-weight:500;color:var(--mute);letter-spacing:0}
@media (max-width:420px){.tabs{width:100%}.tabs button{flex:1;padding:8px 6px;font-size:.8rem}}
/* スマホ: 画面下に結果を常に表示 */
.mbar{display:none}
@media (max-width:860px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;align-items:center;gap:12px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar-bg);color:var(--bar-fg);border:0;
    font:inherit;text-align:left;cursor:pointer;box-shadow:0 -2px 12px rgba(0,0,0,.18)}
  .mbar[hidden]{display:none}
  .mbar .mb-t{flex:1;min-width:0;font-size:.78rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .mbar .mb-v{font-family:var(--f-num);font-weight:700;font-size:1.7rem;color:var(--bar-acc);white-space:nowrap}
  .mbar .mb-v small{font-size:.9rem;margin-left:2px;color:var(--bar-fg)}
  .mbar .mb-go{font-size:.72rem;opacity:.75;white-space:nowrap}
  .app{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
</style>

<div class="app">
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="19" fill="var(--sh-cv)"/>
      <circle cx="20" cy="12.5" r="6.2" fill="var(--c-blk)" stroke="var(--xs-stroke)" stroke-width=".6"/><circle cx="20" cy="12.5" r="3.6" fill="var(--cu)"/>
      <circle cx="13.5" cy="24.2" r="6.2" fill="var(--c-wht)"/><circle cx="13.5" cy="24.2" r="3.6" fill="var(--cu)"/>
      <circle cx="26.5" cy="24.2" r="6.2" fill="var(--c-red)"/><circle cx="26.5" cy="24.2" r="3.6" fill="var(--cu)"/>
    </svg>
    <div><h1>電線許容電流計算機</h1><p class="sub">許容電流 ・ 電力換算 ・ 短絡電流 ・ 試験 ／ 高圧6.6kV対応</p></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="機能">
    <button role="tab" id="tab-calc" data-tab="calc" aria-selected="true">許容電流</button>
    <button role="tab" id="tab-select" data-tab="select" aria-selected="false">負荷から選定</button>
    <button role="tab" id="tab-table" data-tab="table" aria-selected="false">早見表</button>
    <button role="tab" id="tab-tools" data-tab="tools" aria-selected="false">電気計算</button>
  </nav>
</header>

<main class="layout">
  <aside class="panel toolmenu" id="toolmenu" aria-label="計算ツール" hidden>
    <label class="lbl" for="tool-sel">計算ツール</label>
    <select id="tool-sel"></select>
    <nav id="tool-list" class="tool-list"></nav>
  </aside>
  <aside class="panel cond" aria-label="電線と布設の条件">
    <div class="field">
      <div class="lbl">電線の種類</div>
      <div id="typepick" class="typepick"></div>
      <div class="tname" id="tname"></div>
    </div>
    <div class="field" id="f-size">
      <label class="lbl" for="size">サイズ</label>
      <select id="size"></select>
    </div>
    <div class="field" id="f-method">
      <div class="lbl">算定方式</div>
      <div class="seg" id="method"></div>
    </div>
    <div class="field" id="f-cores">
      <div class="lbl">心数</div>
      <div class="seg" id="cores"></div>
    </div>
    <div class="field" id="f-lay">
      <div class="lbl">布設方法</div>
      <div class="seg" id="lay"></div>
      <select id="lay-sel" aria-label="布設方法" hidden></select>
    </div>
    <div class="field" id="f-n">
      <label class="lbl" for="n"><span id="n-label">同一管内の電線数</span> <span class="hint" id="n-hint"></span></label>
      <div class="stepper"><button type="button" data-step="n" data-d="-1" aria-label="減らす">−</button><input id="n" type="number" inputmode="numeric" min="1" max="200"><button type="button" data-step="n" data-d="1" aria-label="増やす">＋</button></div>
    </div>
    <div class="field" id="f-temp">
      <label class="lbl" for="temp"><span id="temp-label">周囲温度</span> (℃)</label>
      <div class="stepper"><button type="button" data-step="temp" data-d="-1" aria-label="下げる">−</button><input id="temp" type="number" inputmode="decimal" min="-10" max="80"><button type="button" data-step="temp" data-d="1" aria-label="上げる">＋</button></div>
      <div class="chips" id="temp-chips"></div>
    </div>
    <div class="field" id="f-multi">
      <label class="lbl" for="multi">多条布設の低減率</label>
      <select id="multi"></select>
      <input id="multi-custom" type="number" inputmode="decimal" step="0.01" min="0.1" max="1" aria-label="低減率を直接入力" hidden>
    </div>
  </aside>

  <section class="main">
    <!-- 許容電流 -->
    <div id="view-calc" class="main">
      <div class="panel hero">
        <div>
          <div class="eyebrow" id="r-title"></div>
          <div class="big"><span class="v" id="r-val">–</span><span class="u">A</span></div>
          <div class="r-sub" id="r-sub"></div>
          <div class="pills" id="r-pills"></div>
        </div>
        <figure class="xsec"><svg id="xsec" viewBox="0 0 120 120" role="img" aria-label="電線の断面"></svg><figcaption id="xsec-cap"></figcaption></figure>
      </div>
      <div class="panel">
        <h2>計算の内訳</h2>
        <ol class="steps" id="r-steps"></ol>
      </div>
      <div class="panel">
        <h2 id="r-all-h">同じ条件での全サイズ</h2>
        <div class="tbl-wrap"><table id="r-all"></table></div>
      </div>
      <div class="panel notes" id="r-notes"></div>
    </div>

    <!-- 負荷から選定 -->
    <div id="view-select" class="main" hidden>
      <div class="panel">
        <h2>負荷と配線の条件</h2>
        <div class="form-grid">
          <div class="field"><label class="lbl" for="sys">電気方式</label><select id="sys"></select></div>
          <div class="field"><div class="lbl">入力のしかた</div><div class="seg" id="inmode"></div></div>
          <div class="field"><label class="lbl" for="load" id="load-label">負荷電流 (A)</label><input id="load" type="number" inputmode="decimal" min="0" step="any"></div>
          <div class="field" id="f-pf"><label class="lbl" for="pf">力率</label><input id="pf" type="number" inputmode="decimal" min="0.1" max="1" step="0.01"></div>

// ===== 計算エンジンと画面 =====
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const f2 = x => (Math.round(x * 100) / 100).toFixed(2);
const f1 = x => (Math.round(x * 10) / 10).toFixed(1);

const sizeLabel = k => k[0] === 'd' ? k.slice(1) + 'mm' : k.slice(1) + 'mm²';
const sizeVal = k => parseFloat(k.slice(1));
const sizeArea = k => k[0] === 'd' ? Math.PI * sizeVal(k) ** 2 / 4 : sizeVal(k);
const coreName = c => c === 1 ? '単心' : c + '心';

// ---- 電技解釈 第146条 ----
function kBase(k) {
  const v = sizeVal(k), tbl = k[0] === 'd' ? K_SOLID : K_STR;
  let r = null;
  for (const [lo, a] of tbl) if (v >= lo - 1e-9) r = a;
  return r;
}
function kCorr(ins, th) {
  const I = INSUL[ins], t = Math.max(th, 30);
  return t >= I.t ? 0 : I.mult * Math.sqrt((I.t - t) / 30);
}
function kRedRow(n) { for (const r of K_RED) if (n <= r[0]) return r; return K_RED[K_RED.length - 1]; }

// ---- 方式 ----
// 'K' = 電技解釈146条の計算 / 'NW:表' = 内線規程の絶縁電線表 / 'T:表' = ケーブル等の表(JCS・カタログ・内線規程)
const mk = m => m === 'K' ? 'K' : m.slice(0, m.indexOf(':'));
const mref = m => m.slice(m.indexOf(':') + 1);
function methodLabel(m) {
  if (m === 'K') return '電技解釈146条';
  if (mk(m) === 'NW') return '内線規程の表';
  return JT[mref(m)].short;
}

// ---- 種類・状態 ----
const TMAP = Object.fromEntries(TYPES.map(t => [t.id, t]));
const DEF = {
  tab: 'calc', type: 'IV', sizes: {}, method: {}, cores: {}, layK: 'conduit', layJ: 'air',
  n: 3, temps: {}, multi: 1, multiIdx: 0, multiCustom: false,
  sys: '3p3w200', inmode: 'A', load: 30, pf: 0.8, lkind: 'gen', len: 30, vd: 2, bkchk: true
};
const SKEY = 'kyoyo_denryu_v1';
let S = JSON.parse(JSON.stringify(DEF));
try { const o = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (o && typeof o === 'object') S = Object.assign(S, o); } catch (e) {}
if (!TMAP[S.type]) S.type = DEF.type;
for (const k of ['sizes', 'method', 'cores', 'temps']) if (!S[k] || typeof S[k] !== 'object') S[k] = {};
if (!MULTI_AIR[S.multiIdx]) S.multiIdx = 0;
if (!S.multiCustom) S.multi = MULTI_AIR[S.multiIdx][0];
function save() { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} }

const T = () => TMAP[S.type];
function methodOf(t) { const m = S.method[t.id]; return t.methods.includes(m) ? m : t.methods[0]; }
const kindOf = t => mk(methodOf(t));
function JTof(t) { return JT[mref(methodOf(t))]; }
function coreList(t) { return t.kind === 'wire' ? [] : Object.keys(JTof(t).cores).map(Number); }
function coresOf(t) {
  const list = coreList(t);
  if (!list.length) return 1;
  const c = S.cores[t.id];
  return list.includes(c) ? c : (list.includes(t.defCores) ? t.defCores : list[0]);
}
function jtbl(t) { return JTof(t).cores[coresOf(t)]; }
function sizesOf(t) {
  const m = methodOf(t), k = mk(m);
  if (k === 'K') return t.sizes;
  if (k === 'NW') return t.sizes.filter(s => NWT[mref(m)].rows[s]);
  return jtbl(t).sizes.filter(s => !t.only || t.only.includes(s));
}
function sizeOf(t) {
  const list = sizesOf(t), s = S.sizes[t.id];
  if (list.includes(s)) return s;
  if (s) { // 一覧にないときは断面積の近いサイズ
    const a = sizeArea(s); let best = list[0], bd = 1e9;
    for (const k of list) { const d = Math.abs(Math.log(sizeArea(k) / a)); if (d < bd) { bd = d; best = k; } }
    return best;
  }
  return t.defSize && list.includes(t.defSize) ? t.defSize : list[0];
}
function layOptions(t) {
  if (kindOf(t) === 'T') {
    return jtbl(t).lays.filter(l => l[3].some(v => v != null)).map(l => [l[0], l[1]]);
  }
  return [['open', 'がいし引き・露出'], ['conduit', '管・線ぴに収める']];
}
function layOf(t) {
  const opts = layOptions(t).map(o => o[0]);
  const l = kindOf(t) === 'T' ? S.layJ : S.layK;
  return opts.includes(l) ? l : opts[0];
}
function layEntry(t, lay) { return kindOf(t) === 'T' ? jtbl(t).lays.find(l => l[0] === lay) : null; }
function isGround(t, lay) { const e = layEntry(t, lay); return !!(e && e[2]); }
function canMulti(t, lay) { const e = layEntry(t, lay); return !!(e && e[4]); }
function baseTemp(t, lay) { return kindOf(t) === 'T' ? (isGround(t, lay) ? JTof(t).tGnd : JTof(t).tAir) : 30; }
function tempKey(t, lay) { return (isGround(t, lay) ? 'G' : 'A') + baseTemp(t, lay); }
function getTemp(t, lay) { const k = tempKey(t, lay), v = S.temps[k]; return typeof v === 'number' ? v : baseTemp(t, lay); }
function setTemp(t, lay, v) { S.temps[tempKey(t, lay)] = Math.max(-10, Math.min(80, v)); }

// ---- 1点の計算 ----
// o: {size, lay, n, temp, multi, cores}
function calc(t, o) {
  const m = methodOf(t), k = mk(m);
  if (k === 'K') {
    const base = kBase(o.size);
    if (base == null) return {ok: false, why: '146条の表の範囲外のサイズです'};
    const I = INSUL[t.ins], corr = kCorr(t.ins, o.temp);
    let red = 1, redRow = null;
    if (o.lay === 'conduit') { redRow = kRedRow(o.n); red = redRow[1]; }
    const raw = base * corr * red;
    return {ok: true, k, val: Math.floor(raw * 10 + 1e-7) / 10, dec: 1, raw, base, corr, red, redRow, T: I.t, ins: I};
  }
  if (k === 'NW') {
    const N = NWT[mref(m)], row = N.rows[o.size];
    if (!row) return {ok: false, why: '内線規程の表にないサイズです'};
    let col = 0, redRow = null;
    if (o.lay === 'conduit') { redRow = kRedRow(o.n); col = 1 + K_RED.indexOf(redRow); }
    const base = row[col];
    const corr = o.temp >= N.T ? 0 : Math.sqrt((N.T - o.temp) / (N.T - 30));
    const val = o.temp === 30 ? base : Math.floor(base * corr + 1e-9);
    return {ok: true, k, val, raw: base * corr, base, corr, redRow, T: N.T, N};
  }
  const J = JTof(t), tb = J.cores[o.cores];
  const i = tb ? tb.sizes.indexOf(o.size) : -1;
  const e = tb ? tb.lays.find(l => l[0] === o.lay) : null;
  const base = i >= 0 && e ? e[3][i] : null;
  if (base == null) return {ok: false, why: 'この布設方法の値は表にありません'};
  const th0 = e[2] ? J.tGnd : J.tAir;
  const corr = o.temp >= J.tmax ? 0 : Math.sqrt((J.tmax - o.temp) / (J.tmax - th0));
  const raw = base * corr * o.multi;
  const val = o.temp === th0 && o.multi === 1 ? base : Math.floor(raw + 1e-9);
  return {ok: true, k, val, raw, base, corr, th0, tmax: J.tmax, multi: o.multi, J};
}
const fmtA = r => r.dec ? r.val.toFixed(1) : String(r.val);
function curOpt(t, size) {
  const lay = layOf(t);
  return {size: size || sizeOf(t), lay, n: S.n, temp: getTemp(t, lay), multi: canMulti(t, lay) ? S.multi : 1, cores: coresOf(t)};
}

function seg(el, opts, cur, on) {

// ---- 断面図 ----
function core(cx, cy, r, color, cu, shield) {
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(${color})" stroke="var(--xs-stroke)" stroke-width=".7"/>`;
  if (shield) s += `<circle cx="${cx}" cy="${cy}" r="${r * .9}" fill="none" stroke="var(--cu)" stroke-width="1.8"/><circle cx="${cx}" cy="${cy}" r="${r * .78}" fill="var(--semi)"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${cu}" fill="var(--cu)"/><circle cx="${cx - cu * .3}" cy="${cy - cu * .3}" r="${cu * .35}" fill="var(--cu-hi)" opacity=".7"/>`;
  return s;
}
const CORE_COLORS = ['--c-blk', '--c-wht', '--c-red', '--c-grn'];
function drawXsec(t) {
  const d = t.draw || {}, n = t.kind === 'wire' ? 1 : coresOf(t);
  const cols = d.colors || CORE_COLORS, hv = !!d.hv;
  let s = '', cap;
  if (d.bare) {
    const R = 11; // 7本より
    [[60, 60]].concat([0, 1, 2, 3, 4, 5].map(i => [60 + 2 * R * Math.cos(i * Math.PI / 3), 60 + 2 * R * Math.sin(i * Math.PI / 3)]))
      .forEach(([x, y]) => { s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R}" fill="var(--cu)" stroke="var(--xs-stroke)" stroke-width=".6"/><circle cx="${(x - 3).toFixed(1)}" cy="${(y - 3).toFixed(1)}" r="3.5" fill="var(--cu-hi)" opacity=".7"/>`; });
    cap = '裸線(7本より)';
  } else if (t.kind === 'wire') {
    s = core(60, 60, 34, d.ins || '--c-blk', 20); cap = '絶縁電線';
  } else if (d.shape === 'flat') {
    const w = n === 2 ? 80 : 104, x = 60 - w / 2;
    s = `<rect x="${x}" y="40" width="${w}" height="40" rx="14" fill="var(${d.sheath})" stroke="var(--xs-stroke)" stroke-width=".7"/>`;
    for (let i = 0; i < n; i++) s += core(x + 20 + i * ((w - 40) / (n - 1)), 60, 13, cols[i], 7);
    cap = `平形 ${n}心`;
  } else if (d.shape === 'triplex') {
    const pos = {2: [[37, 60], [83, 60]], 3: [[60, 37], [40, 72], [80, 72]], 4: [[38, 38], [82, 38], [82, 82], [38, 82]]}[n] || [];
    const R = n === 4 ? 20.5 : 21.5;
    pos.forEach(([x, y], i) => {
      s += d.nosheath ? core(x, y, R, d.sheath, 11) : `<circle cx="${x}" cy="${y}" r="${R}" fill="var(${d.sheath})" stroke="var(--xs-stroke)" stroke-width=".7"/>` + core(x, y, R - 6, hv ? '--c-blk' : cols[i], hv ? 6.5 : 9, hv);
    });
    cap = d.nosheath ? `${n}個より` : ({2: 'デュプレックス', 3: 'トリプレックス', 4: 'クワドルプレックス'}[n] || '');
  } else {
    s = `<circle cx="60" cy="60" r="54" fill="var(${d.sheath})" stroke="var(--xs-stroke)" stroke-width=".7"/>`;
    const L = {1: [[60, 60, 36]], 2: [[39, 60, 19], [81, 60, 19]], 3: [[60, 38, 20], [41, 71, 20], [79, 71, 20]], 4: [[41, 41, 17], [79, 41, 17], [79, 79, 17], [41, 79, 17]]}[n] || [];
    L.forEach(([x, y, r], i) => { s += core(x, y, r, hv || n === 1 ? '--c-blk' : cols[i], r * (hv ? .42 : .58), hv); });
    cap = coreName(n);
  }
  $('#xsec').innerHTML = s;
  $('#xsec-cap').textContent = cap;
}

function breakerFor(a) { let r = null; for (const b of BREAKERS) if (b <= a + 1e-9) r = b; return r; }

// ---------- 基本・電力 ----------
addTool({
  id: 'power', g: '基本・電力', name: '電力の換算(kVA・kW・kVAR・A・V・力率)',
  desc: 'わかっている値を2つ入れると、皮相電力・有効電力・無効電力・電流・力率をまとめて求めます。力率は遅れ(誘導性負荷)として計算します。',
  fields: [
    {id: 'ph', l: '相', t: 'sel', o: PH, d: '3'},
    {id: 'v', l: '線間電圧', u: 'V', d: 6600},
    {id: 'known', l: 'わかっている値', t: 'sel', d: 'SPF', o: [['SPF', 'kVAと力率'], ['PPF', 'kWと力率'], ['IPF', '電流と力率'], ['PQ', 'kWとkVAR'], ['SP', 'kVAとkW'], ['IP', '電流とkW'], ['QPF', 'kVARと力率']]},
    {id: 's', l: '皮相電力', u: 'kVA', d: 300, show: v => ['SPF', 'SP'].includes(v.known)},
    {id: 'p', l: '有効電力', u: 'kW', d: 240, show: v => ['PPF', 'PQ', 'SP', 'IP'].includes(v.known)},
    {id: 'q', l: '無効電力', u: 'kVAR', d: 180, show: v => ['PQ', 'QPF'].includes(v.known)},
    {id: 'i', l: '電流', u: 'A', d: 26.2, show: v => ['IPF', 'IP'].includes(v.known)},
    {id: 'pf', l: '力率', u: '(0〜1)', d: 0.8, step: 0.01, show: v => /PF$/.test(v.known)}
  ],
  calc(v) {
    const k = v.ph === '3' ? SQ3 : 1, kv = k * v.v / 1000;
    let S, P, Q, pf;
    const Sfi = () => kv * v.i;
    switch (v.known) {
      case 'SPF': S = v.s; pf = v.pf; break;
      case 'PPF': P = v.p; pf = v.pf; S = P / pf; break;
      case 'IPF': S = Sfi(); pf = v.pf; break;
      case 'PQ': P = v.p; Q = v.q; S = Math.hypot(P, Q); pf = P / S; break;
      case 'SP': S = v.s; P = v.p; pf = P / S; break;
      case 'IP': S = Sfi(); P = v.p; pf = P / S; break;
      case 'QPF': Q = v.q; pf = v.pf; S = Q / Math.sqrt(1 - pf * pf); break;
    }
    if (!(pf > 0 && pf <= 1)) return {warn: '力率が0〜1の範囲になりません。kWがkVAより大きくないか確認してください。'};
    const sin = Math.sqrt(1 - pf * pf);
    if (P == null) P = S * pf;
    if (Q == null) Q = S * sin;
    const I = S / kv, th = Math.acos(pf);
    const kname = v.ph === '3' ? '√3 × ' : '';
    return {
      tiles: [tile('皮相電力', na(S), 'kVA', 'S'), tile('有効電力', na(P), 'kW', 'P = S × cosθ'), tile('無効電力', na(Q), 'kVAR', 'Q = S × sinθ'),
        tile('電流', na(I), 'A', `I = S ÷ (${kname}V)`, 'cu'), tile('力率', nfix(pf * 100, 1), '%', `cosθ = ${nfix(pf, 3)}`), tile('位相角', nfix(deg(th), 1), '°', `sinθ = ${nfix(sin, 3)}`)],
      steps: [
        {b: '皮相電力 S', s: v.known === 'IPF' || v.known === 'IP' ? `${kname}${v.v}V × ${na(v.i)}A ÷ 1000` : v.known === 'PQ' ? `√(P² + Q²) = √(${na(P)}² + ${na(Q)}²)` : v.known === 'PPF' ? `P ÷ cosθ = ${na(P)} ÷ ${pf}` : v.known === 'QPF' ? `Q ÷ sinθ` : '入力値', v: na(S) + ' kVA'},
        {op: '→', b: '有効電力 P', s: 'S × cosθ', v: na(P) + ' kW'},
        {op: '→', b: '無効電力 Q', s: 'S × sinθ = √(S² − P²)', v: na(Q) + ' kVAR'},
        {op: '→', b: '電流 I', s: `S × 1000 ÷ (${kname}${v.v}V)`, v: na(I) + ' A', cls: 'total'}
      ],
      fig: triangleSVG(P, Q, S, th),
      notes: ['三相は S = √3 × V × I、単相は S = V × I(Vは線間電圧)。進み力率(コンデンサ過補償)でも大きさは同じ式で求まります。']
    };
  }
});
function triangleSVG(P, Q, S, th) {
  const W = 380, H = 210, m = 40, sc = Math.min((W - 2 * m - 60) / Math.max(P, 1e-9), (H - 2 * m) / Math.max(Q, 1e-9));
  const x0 = m, y0 = m, x1 = x0 + P * sc, y1 = y0 + Q * sc;
  const a = 26;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="電力の三角形">
  <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="var(--ok)" stroke-width="3"/>
  <line x1="${x1}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--warn)" stroke-width="3"/>
  <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--accent)" stroke-width="3"/>
  <path d="M ${x0 + a} ${y0} A ${a} ${a} 0 0 1 ${x0 + a * Math.cos(th)} ${y0 + a * Math.sin(th)}" fill="none" stroke="var(--mute)"/>
  <text class="fig-t" x="${(x0 + x1) / 2}" y="${y0 - 10}" text-anchor="middle" fill="var(--ok)">P ${na(P)} kW</text>
  <text class="fig-t" x="${x1 + 8}" y="${(y0 + y1) / 2 + 4}">Q ${na(Q)} kVAR</text>
  <text class="fig-t" x="${(x0 + x1) / 2 - 12}" y="${(y0 + y1) / 2 + 20}" text-anchor="end">S ${na(S)} kVA</text>
  <text class="fig-m" x="${x0 + a + 6}" y="${y0 + 16}">θ ${nfix(deg(th), 1)}°</text>
</svg>`;
}

addTool({
  id: 'ohm', g: '基本・電力', name: 'オームの法則・電力(V・I・R・W)',
  desc: '直流回路や抵抗負荷(ヒーターなど)で、電圧・電流・抵抗・電力のうち2つから残りを求めます。',
  fields: [
    {id: 'known', l: 'わかっている値', t: 'sel', d: 'VR', o: [['VR', '電圧と抵抗'], ['VI', '電圧と電流'], ['IR', '電流と抵抗'], ['PV', '電力と電圧'], ['PI', '電力と電流'], ['PR', '電力と抵抗']]},
    {id: 'v', l: '電圧', u: 'V', d: 200, show: v => /V/.test(v.known)},
    {id: 'i', l: '電流', u: 'A', d: 10, show: v => /I/.test(v.known)},
    {id: 'r', l: '抵抗', u: 'Ω', d: 20, show: v => /R/.test(v.known)},
    {id: 'p', l: '電力', u: 'W', d: 2000, show: v => /P/.test(v.known)}
  ],
  calc(v) {
    let V, I, R, P;
    switch (v.known) {
      case 'VR': V = v.v; R = v.r; I = V / R; break;
      case 'VI': V = v.v; I = v.i; R = V / I; break;
      case 'IR': I = v.i; R = v.r; V = I * R; break;
      case 'PV': P = v.p; V = v.v; I = P / V; R = V / I; break;
      case 'PI': P = v.p; I = v.i; V = P / I; R = V / I; break;
      case 'PR': P = v.p; R = v.r; I = Math.sqrt(P / R); V = I * R; break;
    }
    if (P == null) P = V * I;
    return {
      tiles: [tile('電圧', na(V), 'V'), tile('電流', na(I), 'A', '', 'cu'), tile('抵抗', na(R), 'Ω'), tile('電力', na(P), 'W', na(P / 1000, 3) + ' kW')],

    };
  }
});

    const t1 = Math.tan(Math.acos(v.pf1)), t2 = Math.tan(Math.acos(v.pf2)), Qc = v.p * (t1 - t2);
    const list = PFC_HV;
    const pick = upStd(Qc, list);
    const Q2 = v.p * t1 - (pick || 0), pfn = v.p / Math.hypot(v.p, Q2);
    const ired = (1 - v.pf1 / pfn) * 100, lred = (1 - (v.pf1 / pfn) ** 2) * 100;
    const pfr = x => Math.min(100, Math.round(x * 100)), f1 = (185 - pfr(v.pf1)) / 100, f2x = (185 - pfr(pick ? pfn : v.pf2)) / 100;
    const save = v.kwc * v.bu * (f1 - f2x) * 12;
    return {
      tiles: [tile('必要な容量', na(Qc), 'kvar', 'P × (tanθ1 − tanθ2)', 'cu'), tile('標準容量', pick ? pick : '–', pick ? 'kvar' : '', pick ? '必要容量以上で最小' : '系列の最大を超えます。複数台で組み合わせてください', 'ok'),
        tile('改善後の力率', pick ? nfix(pfn * 100, 1) : '–', '%', Q2 < 0 ? '進み力率(過補償)' : '遅れ'), tile('電流の減少', pick ? nfix(ired, 1) : '–', '%', '同じkWでの線電流'),
        tile('線路損失の減少', pick ? nfix(lred, 1) : '–', '%', '損失は電流の2乗に比例'),
        tile('基本料金の差(年間)', v.kwc && v.bu ? na(save, 0) : '–', v.kwc && v.bu ? '円' : '', `係数 ${nfix(f1, 2)} → ${nfix(f2x, 2)}(力率85%基準)`, 'ok')],
      steps: [
        {b: 'tanθ1(改善前)', s: `cosθ1 = ${v.pf1}`, v: nfix(t1, 3)},
        {b: 'tanθ2(目標)', s: `cosθ2 = ${v.pf2}`, v: nfix(t2, 3)},
        {op: '→', b: '必要容量 Qc', s: `${v.p}kW × (${nfix(t1, 3)} − ${nfix(t2, 3)})`, v: na(Qc) + ' kvar', cls: 'total'}
      ],
      notes: [PFC_NOTE, '基本料金は 基本料金単価 × 契約電力 × (185 − 力率) ÷ 100 で、力率85%より1%よいごとに1%割引、悪いと割増しです(東京電力EPの高圧約款で確認。力率は8時〜22時の平均で、1%単位に四捨五入、上限100%)。他の電力会社も同じ考え方ですが、契約先の約款で確認してください。']
    };
  }
});

// ---------- 画面 ----------
function toolVals(t) {
  const st = (S.tv = S.tv || {})[t.id] = S.tv[t.id] || {};
  const v = {};
  for (const f of t.fields) { const x = st[f.id]; v[f.id] = x !== undefined ? x : f.d; if (f.t !== 'sel') v[f.id] = +v[f.id]; }
  return v;
}
function curTool() { return TOOLS.find(t => t.id === S.tool) || TOOLS[0]; }
function renderToolMenu() {
  const t = curTool(), groups = [];
  for (const x of TOOLS) { let g = groups.find(g => g.n === x.g); if (!g) groups.push(g = {n: x.g, items: []}); g.items.push(x); }
  groups.sort((a, b) => GORDER.indexOf(a.n) - GORDER.indexOf(b.n));
  $('#tool-list').innerHTML = groups.map(g => `<div class="tg">${esc(g.n)}</div>` + g.items.map(x => `<button type="button" data-id="${x.id}" aria-current="${x.id === t.id}">${esc(x.name)}</button>`).join('')).join('');
  $('#tool-sel').innerHTML = groups.map(g => `<optgroup label="${esc(g.n)}">` + g.items.map(x => `<option value="${x.id}"${x.id === t.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('') + '</optgroup>').join('');
}
function renderToolForm() {
  const t = curTool(), v = toolVals(t);
  $('#tool-group').textContent = t.g;
  $('#tool-title').textContent = t.name;
  $('#tool-desc').textContent = t.desc;
  $('#tool-form').innerHTML = t.fields.filter(f => !f.show || f.show(v)).map(f => {
    const id = `tf-${t.id}-${f.id}`;
    if (f.t === 'sel') return `<div class="field"><label class="lbl" for="${id}">${esc(f.l)}</label><select id="${id}" data-f="${f.id}">${f.o.map(([ov, ol]) => `<option value="${esc(ov)}"${String(ov) === String(v[f.id]) ? ' selected' : ''}>${esc(ol)}</option>`).join('')}</select></div>`;

  }).join('');
}
function renderToolOut() {
  const t = curTool(), v = toolVals(t);
  let r;
  try { r = t.calc(v) || {}; } catch (e) { r = {warn: '計算できません: ' + e.message}; }
  const ok = !r.warn && r.tiles && r.tiles.every(x => x.v !== 'NaN');
  $('#tool-tiles').innerHTML = r.warn ? `<div class="kv bad"><span class="k">確認してください</span><span class="d" style="font-size:.9rem;color:var(--ng)">${esc(r.warn)}</span></div>`
    : (r.tiles || []).map(x => `<div class="kv${x.cls === 'cu' ? ' hl' : ''}"><span class="k">${esc(x.k)}</span><span class="v ${x.cls || ''}">${x.v}${x.u ? `<small>${esc(x.u)}</small>` : ''}</span>${x.d ? `<span class="d">${x.d}</span>` : ''}</div>`).join('');
  $('#tool-fig-panel').hidden = !(ok && r.fig);
  if (ok && r.fig) $('#tool-fig').innerHTML = r.fig;
  $('#tool-table-panel').hidden = !(ok && r.table);
  if (ok && r.table) {
    $('#tool-table-h').textContent = r.table.h;
    $('#tool-table').innerHTML = `<thead><tr>${r.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>` +
      r.table.rows.map((row, i) => `<tr class="${r.table.hl === i ? 'sel' : ''}">${row.map((c, j) => `<td class="${j === 0 && isNaN(parseFloat(c)) ? 'jp' : ''}">${c}</td>`).join('')}</tr>`).join('') + '</tbody>';
  }
  $('#tool-steps-panel').hidden = !(ok && r.steps);

}
function renderTools() { renderToolMenu(); renderToolForm(); renderToolOut(); }
function setTool(id) { S.tool = id; save(); renderTools(); if (matchMedia('(max-width:860px)').matches) $('#view-tools').scrollIntoView({block: 'start'}); }
$('#tool-list').onclick = e => { const b = e.target.closest('button[data-id]'); if (b) setTool(b.dataset.id); };
$('#tool-sel').onchange = e => setTool(e.target.value);
$('#tool-form').addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f) return;

  if (e.target.tagName === 'SELECT') { st[f] = e.target.value; save(); renderToolForm(); renderToolOut(); return; }
  const x = parseFloat(e.target.value); if (!isFinite(x)) return;
  st[f] = x; save(); renderToolOut();
});

};
const CAB_SRC = 'ケーブル定数はSFCC(昭和電線・古河)・フジクラ・ダイヤ・住電HST・北日本電線のカタログ値(90℃の交流導体抵抗)です。';
// 「種類|サイズ」の選択肢
function cabOpts(keys, withManual) {
  const o = [];
  for (const k of keys) for (const s of CAB[k].sizes) o.push([`${k}|${s}`, `${CAB[k].name} ${s}mm²`]);
  if (withManual) o.push(['manual', 'R・Xを直接入力']);
  return o;
}
function cabRX(key, f) {
  if (!key || key === 'manual' || key === 'none') return null;
  const [k, s] = key.split('|'), c = CAB[k], i = c.sizes.indexOf(+s);
  return {name: `${c.name} ${s}mm²`, r: c['r' + f][i], x: c['x' + f][i], c: c.c ? c.c[i] : null, size: +s};
}
const FREQ = [['50', '50Hz(東日本)'], ['60', '60Hz(西日本)']];

// ---------- 短絡・地絡・保護 ----------
addTool({
  id: 'short', g: '短絡・地絡・保護', name: '三相短絡電流(%インピーダンス法)',
  desc: '受電点の短絡電流(または%Z)に、高圧ケーブル・変圧器・低圧ケーブルの%Zを足して、各点の三相短絡電流と短絡容量を求めます。基準容量は10MVAです。',
  fields: [
    {id: 'f', l: '周波数', t: 'sel', o: FREQ, d: '60'},
    {id: 'src', l: '受電点の値', t: 'sel', d: 'ka', o: [['ka', '三相短絡電流(kA)で入力'], ['pz', '%R・%X(10MVA基準)で入力']]},
    {id: 'ika', l: '受電点の三相短絡電流', u: 'kA', d: 12.5, show: v => v.src === 'ka'},
    {id: 'pr', l: '受電点 %R', u: '%', d: 1.0, show: v => v.src === 'pz'},
    {id: 'px', l: '受電点 %X', u: '%', d: 5.0, show: v => v.src === 'pz'},
    {id: 'hc', l: '高圧ケーブル', t: 'sel', d: 'hvCVT|38', o: [['none', 'なし']].concat(cabOpts(['hvCVT', 'hvCV3']))},
    {id: 'hl', l: '高圧ケーブルのこう長', u: 'm', d: 50, show: v => v.hc !== 'none'},
    {id: 'ts', l: '変圧器容量(三相)', u: 'kVA', d: 300},
    {id: 'tz', l: '変圧器 %Z', u: '%(自己容量基準)', d: 3.0, step: 0.1},
    {id: 'tpc', l: '変圧器 負荷損', u: 'W(%R計算用)', d: 2510},
    {id: 'v2', l: '2次電圧', u: 'V', d: 210},
    {id: 'lc', l: '低圧ケーブル', t: 'sel', d: 'lvCVT|150', o: [['none', 'なし']].concat(cabOpts(['lvCVT', 'lvCV']))},
    {id: 'll', l: '低圧ケーブルのこう長', u: 'm', d: 30, show: v => v.lc !== 'none'}
  ],
  calc(v) {
    const Pb = 10; // MVA
    const zOhm = (ohm, kv) => ohm * Pb / (kv * kv) * 100; // Ω → %(10MVA基準)
    let sr, sx;
    if (v.src === 'ka') { sr = 0; sx = Pb / (SQ3 * 6.6 * v.ika) * 100; } else { sr = v.pr; sx = v.px; }
    const pts = [], add = (name, r, x, kv) => pts.push({name, r, x, kv});
    let R = sr, X = sx;
    add('① 受電点', R, X, 6.6);
    const hc = cabRX(v.hc, v.f);
    let hr = 0, hx = 0;
    if (hc) { hr = zOhm(hc.r * v.hl / 1000, 6.6); hx = zOhm(hc.x * v.hl / 1000, 6.6); R += hr; X += hx; add('② 変圧器1次(高圧ケーブル末端)', R, X, 6.6); }
    const k = Pb * 1000 / v.ts, trr = v.tpc / (v.ts * 1000) * 100;
    if (trr >= v.tz) return {warn: '変圧器の負荷損が大きすぎます(%R が %Z を超えます)。値を確認してください。'};
    const trx = Math.sqrt(v.tz ** 2 - trr ** 2);
    R += trr * k; X += trx * k; add('③ 変圧器2次端子', R, X, v.v2 / 1000);
    const lc = cabRX(v.lc, v.f);
    let lr = 0, lx = 0;
    if (lc) { lr = zOhm(lc.r * v.ll / 1000, v.v2 / 1000); lx = zOhm(lc.x * v.ll / 1000, v.v2 / 1000); R += lr; X += lx; add('④ 低圧ケーブル末端', R, X, v.v2 / 1000); }
    for (const p of pts) { p.z = Math.hypot(p.r, p.x); p.is = Pb * 1000 / (SQ3 * p.kv) * 100 / p.z / 1000; p.mva = Pb * 100 / p.z; }
    const hvEnd = pts[hc ? 1 : 0], tr2 = pts.find(p => p.name.startsWith('③')), last = pts[pts.length - 1];
    const mccb = [2.5, 5, 10, 15, 25, 30, 35, 50, 65, 85, 100, 125];
    const need = upStd(last.is, mccb);
    return {
      tiles: [tile('受電点', nfix(pts[0].is, 2), 'kA', `短絡容量 ${na(pts[0].mva)}MVA`),
        tile('変圧器1次', nfix(hvEnd.is, 2), 'kA', hvEnd.is <= 12.5 ? 'VCB・PF 12.5kA 以内' : '12.5kA を超えます', hvEnd.is <= 12.5 ? 'ok' : 'ng'),
        tile('変圧器2次端子', nfix(tr2.is, 1), 'kA', `2相短絡 ${nfix(tr2.is * SQ3 / 2, 1)}kA`, 'cu'),
        tile(lc ? '低圧ケーブル末端' : '低圧側', nfix(last.is, 1), 'kA', need ? `遮断容量 ${need}kA 以上の遮断器` : '遮断容量の大きい遮断器が必要')],
      table: {h: '各点の%インピーダンス(10MVA基準)と短絡電流', head: ['地点', '%R', '%X', '%Z', '三相短絡 kA', '短絡容量 MVA'],
        rows: pts.map(p => [p.name, nfix(p.r, 2), nfix(p.x, 2), nfix(p.z, 2), nfix(p.is, 2), na(p.mva)])},
      steps: [
        {b: '受電点', s: v.src === 'ka' ? `10MVA ÷ (√3 × 6.6kV × ${v.ika}kA) × 100(全量を%Xとして扱う)` : '入力値', v: `${nfix(sr, 2)} + j${nfix(sx, 2)} %`},
        hc ? {op: '+', b: '高圧ケーブル', s: `${hc.name} ${v.hl}m: R ${hc.r}・X ${hc.x} Ω/km × ${v.hl / 1000}km × 10 ÷ 6.6² × 100`, v: `${nfix(hr, 3)} + j${nfix(hx, 3)} %`} : null,
        {op: '+', b: '変圧器', s: `%R = ${v.tpc}W ÷ ${v.ts}kVA = ${nfix(trr, 2)}%、%X = √(${v.tz}² − %R²) = ${nfix(trx, 2)}%、× 10,000 ÷ ${v.ts}`, v: `${nfix(trr * k, 2)} + j${nfix(trx * k, 2)} %`},
        lc ? {op: '+', b: '低圧ケーブル', s: `${lc.name} ${v.ll}m × 10 ÷ ${(v.v2 / 1000)}² × 100`, v: `${nfix(lr, 2)} + j${nfix(lx, 2)} %`} : null,
        {op: '→', b: '短絡電流', s: `基準電流 ÷ %Z × 100(基準電流 = 10MVA ÷ (√3 × V))`, v: nfix(last.is, 2) + ' kA', cls: 'total'}
      ].filter(Boolean),
      notes: ['受電点の短絡電流や%Zは電力会社から提示される値を使ってください。わからない場合、6.6kV配電線は12.5kAで検討するのが一般的です(キュービクルのJIS C 4620も系統短絡電流12.5kA以下が前提)。', '変圧器の%Zは銘板値を入れてください。油入300kVAの%Zは2.2〜4.1%程度と幅があり、遮断器の検討では小さめの%Z(=短絡電流が大きい側)で確かめるのが安全です。', '電動機からの寄与電流と、ケーブルの温度による抵抗変化は考えていません。' + CAB_SRC]
    };
  }
});

addTool({
  id: 'charge', g: '短絡・地絡・保護', name: '高圧ケーブルの充電電流(GR・DGRの検討)',
  desc: '構内の高圧ケーブルの静電容量から、平常時の充電電流と、構外で1線地絡が起きたときに流れ出す零相電流を求めます。地絡継電器の不要動作(もらい事故)の検討に使います。',
  fields: [
    {id: 'f', l: '周波数', t: 'sel', o: FREQ, d: '60'},
    {id: 'c1', l: 'ケーブル1', t: 'sel', d: 'hvCVT|38', o: cabOpts(['hvCVT', 'hvCV3'])},
    {id: 'l1', l: 'ケーブル1のこう長', u: 'm', d: 120},
    {id: 'c2', l: 'ケーブル2', t: 'sel', d: 'none', o: [['none', 'なし']].concat(cabOpts(['hvCVT', 'hvCV3']))},
    {id: 'l2', l: 'ケーブル2のこう長', u: 'm', d: 0, show: v => v.c2 !== 'none'},
    {id: 'gr', l: '地絡継電器の整定', u: 'A', d: 0.2, step: 0.1}
  ],
  calc(v) {
    const w = 2 * Math.PI * (+v.f), E = 6600 / SQ3;
    const list = [[v.c1, v.l1], [v.c2, v.l2]].map(([k, l]) => ({c: cabRX(k, v.f), l})).filter(x => x.c && x.l > 0);
    const Ctot = list.reduce((a, x) => a + x.c.c * x.l / 1000, 0); // μF(1心あたり)
    const Ic = w * Ctot * 1e-6 * E, Ig = 3 * Ic, ratio = Ig / v.gr;
    return {
      tiles: [tile('静電容量(1心)', nfix(Ctot, 4), 'μF', list.map(x => `${x.c.name} ${x.l}m`).join(' + ')),
        tile('平常時の充電電流(1相)', na(Ic, 3), 'A', 'ω × C × E'),
        tile('1線地絡時の零相電流', na(Ig, 3), 'A', '3 × ω × C × E(完全地絡)', 'cu'),
        tile('整定値との比', nfix(ratio * 100, 0), '%', ratio >= 0.5 ? '無方向GRは構外事故で動くおそれ。DGRを検討' : '無方向GRでも余裕あり', ratio >= 0.5 ? 'ng' : 'ok')],
      steps: [
        {b: '静電容量', s: list.map(x => `${x.c.c}μF/km × ${x.l / 1000}km`).join(' + '), v: nfix(Ctot, 4) + ' μF'},
        {op: '×', b: 'ω × E', s: `2π × ${v.f}Hz × 6,600V ÷ √3`, v: na(w * E, 0)},
        {op: '=', b: '充電電流(1相)', v: na(Ic, 3) + ' A'},

// ===== 電気計算ツール(法令・規格の基準値を使うもの) =====
// 出典: 電気設備の技術基準の解釈(令和6年10月22日改正版)第1・14・15・16・17条、電技省令第58条、JIS C 4602:2017、JIS C 4902、東京電力EP 電気需給約款

// ---------- 短絡・地絡・保護 ----------
// JIS C 4602:2017 附属書A 標準特性 t = (L/10) × k ÷ (M^α − 1)
const OCR_CURVES = {
  NI: {k: 0.14, a: 0.02, name: '反限時(NI)'},
  VI: {k: 13.5, a: 1, name: '強反限時(VI)'},
  EI: {k: 80, a: 2, name: '超反限時(EI)'}
};
const ocrT = (c, M, L) => M <= 1 ? Infinity : (L / 10) * c.k / (Math.pow(Math.min(M, 20), c.a) - 1);
addTool({
  id: 'ocr', g: '短絡・地絡・保護', name: '過電流継電器(OCR)の動作時間',
  desc: 'CT比・限時タップ・レバー・特性から、故障電流が流れたときの動作時間を求めます。特性式は JIS C 4602 の標準特性です。',
  fields: [
    {id: 'ct', l: 'CT比', t: 'sel', d: '10', o: CT_LIST.filter(c => c >= 10).map(c => [String(c / 5), `${c}/5A`])},
    {id: 'tap', l: '限時タップ', t: 'sel', d: '4', o: ['3', '3.5', '4', '4.5', '5', '6'].map(x => [x, x + 'A'])},
    {id: 'lever', l: 'レバー(動作時間整定)', u: '1〜10', d: 2, step: 0.5},
    {id: 'curve', l: '特性', t: 'sel', d: 'NI', o: Object.entries(OCR_CURVES).map(([k, c]) => [k, c.name])},
    {id: 'inst', l: '瞬時タップ', t: 'sel', d: '40', o: [['0', 'なし(ロック)'], ['30', '30A'], ['40', '40A'], ['50', '50A'], ['60', '60A'], ['80', '80A']]},
    {id: 'i', l: '故障電流(一次側)', u: 'A', d: 400}
  ],
  calc(v) {
    const ct = +v.ct, tap = +v.tap, c = OCR_CURVES[v.curve];
    const Ip = tap * ct, M = v.i / Ip, t = ocrT(c, M, v.lever);
    const Iinst = +v.inst * ct, inst = +v.inst > 0 && v.i >= Iinst;
    const Ms = [1.5, 2, 3, 5, 7, 10, 20];
    const rows = Ms.map(m => [`${m * 100}%`, na(Ip * m, 0), nfix(ocrT(c, m, v.lever), 2)]);
    return {
      tiles: [tile('限時要素の整定(一次)', na(Ip, 0), 'A', `タップ${tap}A × CT比${ct}`), tile('故障電流の倍率', nfix(M, 2), '倍', `${v.i}A ÷ ${na(Ip, 0)}A`),
        tile('動作時間', inst ? '瞬時' : M <= 1 ? '動作しない' : nfix(t, 2), inst || M <= 1 ? '' : '秒', inst ? `瞬時要素(${na(Iinst, 0)}A以上)で0.05秒以内` : M >= 20 ? '20倍以上は20倍の時間' : c.name, 'cu'),
        tile('瞬時要素の整定(一次)', +v.inst ? na(Iinst, 0) : '–', +v.inst ? 'A' : '', +v.inst ? `${v.inst}A × ${ct}` : 'ロック')],
      table: {h: `動作時間の特性(レバー${v.lever})`, head: ['整定の倍率', '一次電流 A', '動作時間 秒'], rows, hl: Ms.findIndex(m => m >= M) >= 0 ? Ms.findIndex(m => m >= M) : undefined},
      fig: ocrSVG(c, v.lever, Ip, v.i, t, inst ? Iinst : null),
      steps: [
        {b: '倍率 M', s: `故障電流 ÷ (タップ × CT比) = ${v.i} ÷ (${tap} × ${ct})`, v: nfix(M, 2)},
        {op: '→', b: '動作時間', s: `(${v.lever} ÷ 10) × ${c.k} ÷ (${nfix(Math.min(M, 20), 2)}^${c.a} − 1)`, v: M > 1 ? nfix(t, 2) + ' 秒' : '–', cls: 'total'}
      ],
      notes: ['JIS C 4602:2017 の標準特性(IEC 60255-151 と同じ式)。レバー10で反限時は300%で約6.3秒・700%で約3.5秒です。', '誘導形・旧型の静止形は特性式がJISに規定されていないため、メーカーの特性曲線で確認してください。JISの動作時間の許容差は300%で±17%、700%で±12%です。', '配電用変電所との保護協調は、管轄の電力会社に整定値を照会して確認してください。']
    };
  }
});
function ocrSVG(c, L, Ip, I, t, Iinst) {
  const W = 420, H = 260, l = 50, r = 16, tp = 14, b = 40;
  const x0 = Math.log10(Ip), x1 = Math.log10(Ip * 30), y0 = -1.3, y1 = 2; // 時間 0.05〜100秒
  const X = a => l + (Math.log10(a) - x0) / (x1 - x0) * (W - l - r);
  const Y = s => tp + (y1 - Math.log10(Math.max(s, 0.05))) / (y1 - y0) * (H - tp - b);
  let d = '';
  for (let m = 1.1; m <= 30; m *= 1.05) { const s = ocrT(c, m, L); if (s <= 100) d += (d ? 'L' : 'M') + X(Ip * m).toFixed(1) + ' ' + Y(s).toFixed(1); }
  let grid = '';
  for (const s of [0.1, 1, 10, 100]) grid += `<line x1="${l}" x2="${W - r}" y1="${Y(s)}" y2="${Y(s)}" stroke="var(--line)"/><text class="fig-m" x="${l - 6}" y="${Y(s) + 4}" text-anchor="end">${s}s</text>`;
  for (const m of [1, 2, 5, 10, 20]) grid += `<line y1="${tp}" y2="${H - b}" x1="${X(Ip * m)}" x2="${X(Ip * m)}" stroke="var(--line)"/><text class="fig-m" x="${X(Ip * m)}" y="${H - b + 14}" text-anchor="middle">${na(Ip * m, 0)}A</text>`;
  let inst = '';
  if (Iinst && Iinst < Ip * 30) inst = `<line x1="${X(Iinst)}" x2="${X(Iinst)}" y1="${tp}" y2="${H - b}" stroke="var(--warn)" stroke-dasharray="4 3"/><text class="fig-m" x="${X(Iinst) + 4}" y="${tp + 10}">瞬時</text>`;
  const pt = I > Ip && I < Ip * 30 && isFinite(t) ? `<circle cx="${X(I)}" cy="${Y(t)}" r="5" fill="var(--accent)"/><text class="fig-t" x="${X(I) + 8}" y="${Y(t) - 6}">${nfix(t, 2)}s</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="OCRの動作特性">${grid}${inst}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${pt}<text class="fig-m" x="${(l + W - r) / 2}" y="${H - 6}" text-anchor="middle">一次電流(対数目盛)</text></svg>`;
}

addTool({
  id: 'earth', g: '短絡・地絡・保護', name: '接地抵抗の基準と判定(A・B・C・D種)',
  desc: '接地工事の種類ごとの基準値(電技解釈 第17条)を求め、測定値を判定します。B種は1線地絡電流 Ig を17-2表の式で計算するか、電力会社から提示された値を入れます。',
  fields: [
    {id: 'kind', l: '接地工事の種類', t: 'sel', d: 'B', o: [['A', 'A種(高圧機器の外箱・避雷器)'], ['B', 'B種(変圧器の低圧側中性点)'], ['C', 'C種(300V超の低圧機器)'], ['D', 'D種(300V以下の低圧機器)']]},
    {id: 'relax', l: '地絡時0.5秒以内に自動遮断', t: 'sel', d: 'no', o: [['no', 'なし'], ['yes', 'あり(漏電遮断器など)']], show: v => v.kind === 'C' || v.kind === 'D'},
    {id: 'igm', l: '1線地絡電流 Ig', t: 'sel', d: 'calc', o: [['calc', '17-2表の式で計算'], ['input', '電力会社の値を入力']], show: v => v.kind === 'B'},
    {id: 'ig', l: '1線地絡電流 Ig', u: 'A', d: 6, show: v => v.kind === 'B' && v.igm === 'input'},
    {id: 'kv', l: '公称電圧', u: 'kV', d: 6.6, show: v => v.kind === 'B' && v.igm === 'calc'},
    {id: 'lo', l: '架空電線の電線延長 L', u: 'km', d: 0, show: v => v.kind === 'B' && v.igm === 'calc'},
    {id: 'lc', l: 'ケーブルの線路延長 L′', u: 'km', d: 5, show: v => v.kind === 'B' && v.igm === 'calc'},
    {id: 'trip', l: '高圧側の自動遮断', t: 'sel', d: 'none', o: [['none', 'なし(または2秒超)'], ['2', '1秒超〜2秒以内'], ['1', '1秒以内']], show: v => v.kind === 'B'},
    {id: 'meas', l: '測定値', u: 'Ω', d: 12}
  ],
  calc(v) {
    let lim, how, steps = [];
    if (v.kind === 'A') { lim = 10; how = 'A種: 10Ω以下'; }
    else if (v.kind === 'C') { lim = v.relax === 'yes' ? 500 : 10; how = v.relax === 'yes' ? 'C種: 0.5秒以内の遮断装置ありで500Ω以下' : 'C種: 10Ω以下'; }
    else if (v.kind === 'D') { lim = v.relax === 'yes' ? 500 : 100; how = v.relax === 'yes' ? 'D種: 0.5秒以内の遮断装置ありで500Ω以下' : 'D種: 100Ω以下'; }
    else {
      let Ig;
      if (v.igm === 'calc') {
        const Vp = v.kv / 1.1, t2 = Math.max(0, (Vp / 3 * v.lo - 100) / 150), t3 = Math.max(0, (Vp / 3 * v.lc - 1) / 2), raw = 1 + t2 + t3;
        Ig = Math.max(2, Math.ceil(raw - 1e-9));
        steps.push({b: "V′ = 公称電圧 ÷ 1.1", s: `${v.kv} ÷ 1.1`, v: nfix(Vp, 3) + ' kV'});
        steps.push({op: '+', b: '架空電線の項', s: `((V′/3) × ${v.lo} − 100) ÷ 150(負なら0)`, v: nfix(t2, 3)});
        steps.push({op: '+', b: 'ケーブルの項', s: `((V′/3) × ${v.lc} − 1) ÷ 2(負なら0)`, v: nfix(t3, 3)});
        steps.push({op: '=', b: 'Ig = 1 + 上の2項', s: `${nfix(raw, 3)} → 小数点以下切り上げ(2A未満は2A)`, v: Ig + ' A'});
      } else Ig = v.ig;
      const k = v.trip === '1' ? 600 : v.trip === '2' ? 300 : 150;
      lim = k / Ig; how = `B種: ${k} ÷ Ig(${Ig}A)`;
      steps.push({op: '→', b: 'B種の上限', s: `${k} ÷ ${Ig}A`, v: nfix(lim, 1) + ' Ω', cls: 'total'});
    }
    const ok = v.meas <= lim + 1e-9;
    if (!steps.length) steps.push({b: how, v: na(lim) + ' Ω', cls: 'total'});
    return {
      tiles: [tile('基準値', na(lim, 1), 'Ω以下', how, 'cu'), tile('判定', ok ? '適合' : '不適合', '', `測定値 ${v.meas}Ω`, ok ? 'ok' : 'ng'),
        tile('余裕', nfix((1 - v.meas / lim) * 100, 0), '%', '基準値に対して')],
      steps,
      notes: ['B種の Ig 計算(17-2表)は中性点非接地式の高圧電路の式です。L は架空電線の「電線延長」(こう長 × 電線本数)、L′ はケーブルの「線路延長」で、単位の考え方が違います。同一母線につながる配電線全体の値なので、通常は電力会社から提示された Ig を使います。', '「高圧側の自動遮断」は、混触で低圧側の対地電圧が150Vを超えたときに高圧電路を自動で遮断する装置の遮断時間です。']
    };
  }
});

    {id: 'obj', l: '試験の方法', t: 'sel', d: 'ac', o: [['ac', '交流(電路・機器)1.5倍'], ['dc', 'ケーブルを直流で(交流試験電圧の2倍)'], ['tr', '変圧器の巻線(500V未満は500V)']]},
    {id: 'f', l: '周波数', t: 'sel', o: FREQ, d: '60', show: v => v.obj !== 'dc'},
    {id: 'c1', l: 'ケーブル', t: 'sel', d: 'hvCVT|38', o: [['none', 'なし']].concat(cabOpts(['hvCVT', 'hvCV3'])), show: v => v.obj !== 'tr'},
    {id: 'l1', l: 'ケーブルのこう長', u: 'm', d: 100, show: v => v.obj !== 'tr' && v.c1 !== 'none'},
    {id: 'cx', l: '機器などの静電容量(対地)', u: 'μF', d: 0.01, step: 0.005, show: v => v.obj !== 'dc'}
  ],
  calc(v) {
    const Em = v.vn <= 1000 ? v.vn * 1.15 : v.vn * 1.15 / 1.1;
    let Vt = Em * 1.5;
    if (v.obj === 'tr') Vt = Math.max(500, Vt);
    const dc = v.obj === 'dc'; if (dc) Vt *= 2;
    const c = v.obj !== 'tr' ? cabRX(v.c1, v.f || '60') : null;
    const Cc = c ? 3 * c.c * v.l1 / 1000 : 0, C = Cc + (dc ? 0 : v.cx); // μF(3心一括・対地)
    const w = 2 * Math.PI * (+v.f || 60), Ic = dc ? 0 : w * C * 1e-6 * Vt, kva = Vt * Ic / 1000;
    return {
      tiles: [tile('最大使用電圧', na(Em, 0), 'V', v.vn <= 1000 ? '公称電圧 × 1.15' : '公称電圧 × 1.15 ÷ 1.1'),
        tile('試験電圧', na(Vt, 0), dc ? 'V(直流)' : 'V(交流)', dc ? '交流試験電圧 × 2 を10分間' : '最大使用電圧 × 1.5 を10分間', 'cu'),
        tile('充電電流', dc ? '–' : na(Ic * 1000, 1), dc ? '' : 'mA', dc ? '直流試験では定常の充電電流は流れません' : `対地静電容量 ${nfix(C, 4)}μF`),
        tile('試験器に必要な容量', dc ? '–' : na(kva, 2), dc ? '' : 'kVA', dc ? '' : '試験電圧 × 充電電流(補償リアクトルなし)')],
      steps: [
        {b: '最大使用電圧', s: v.vn <= 1000 ? `${v.vn} × 1.15` : `${v.vn} × 1.15 ÷ 1.1`, v: na(Em, 0) + ' V'},
        {op: '×', b: '試験電圧', s: dc ? '1.5倍 × 直流2倍' : v.obj === 'tr' ? '1.5倍(500V未満は500V)' : '1.5倍', v: na(Vt, 0) + ' V'},
        c && !dc ? {op: '→', b: 'ケーブルの静電容量', s: `${c.c}μF/km × 3心 × ${v.l1 / 1000}km`, v: nfix(Cc, 4) + ' μF'} : null,
        !dc ? {op: '→', b: '充電電流', s: `2π × ${v.f}Hz × ${nfix(C, 4)}μF × ${na(Vt, 0)}V`, v: na(Ic * 1000, 1) + ' mA', cls: 'total'} : null
      ].filter(Boolean),
      notes: ['6,600V電路は最大使用電圧6,900V、交流試験電圧10,350V、ケーブルの直流試験電圧20,700V(いずれも10分間)。', 'ケーブルの静電容量はカタログの1心あたりの値で、3心を一括して大地(遮へい)との間に加える場合として3倍しています。機器(変圧器・VCT・避雷器など)の分は「機器などの静電容量」に足してください。', '試験器の容量が足りない場合は補償リアクトルで充電電流を打ち消します。']
    };
  }
});

const INS_CASES = [
  ['lv150', '低圧 対地電圧150V以下(100V回路・単相3線など)', 'law', 0.1],
  ['lv300', '低圧 300V以下でその他(三相200Vなど)', 'law', 0.2],
  ['lv600', '低圧 300V超(400V回路など)', 'law', 0.4],
  ['hvc5', '高圧ケーブル 絶縁体(5,000Vメガー)', 'hvc', [5000, 500]],
  ['hvc10', '高圧ケーブル 絶縁体(10,000Vメガー)', 'hvc', [10000, 1000]],
  ['sheath', '高圧ケーブル シース(500V・250Vメガー)', 'hvc', [1, 1]],
  ['hvbus', '高圧 母線・一般(保安協会の目安)', 'guide', 6],
  ['hvtr', '高圧 変圧器(保安協会の目安)', 'guide', 30],
  ['hvsw', '高圧 開閉器・遮断器・コンデンサ(保安協会の目安)', 'guide', 100]
];
addTool({
  id: 'insul', g: '試験・点検', name: '絶縁抵抗・漏えい電流の判定',
  desc: '低圧は電技省令 第58条の基準値、測れないときは漏えい電流1mA(解釈 第14条)で判定します。高圧は法令の基準値がないため、高圧受電設備規程などの目安で判定します。',
  fields: [
    {id: 'cs', l: '測定する電路・部位', t: 'sel', d: 'lv300', o: INS_CASES.map(c => [c[0], c[1]])},
    {id: 'm', l: '測定値', u: 'MΩ', d: 5},
    {id: 'leak', l: '漏えい電流(測れないとき)', u: 'mA', d: 0, show: v => /^lv/.test(v.cs)}
  ],
  calc(v) {
    const c = INS_CASES.find(x => x[0] === v.cs);
    let lim, judge, cls, basis;
    if (c[2] === 'law') { lim = c[3]; const ok = v.m >= lim; judge = ok ? '適合' : '不適合'; cls = ok ? 'ok' : 'ng'; basis = '電技省令 第58条'; }
    else if (c[2] === 'hvc') { const [good, bad] = c[3]; lim = good; judge = v.m >= good ? '良' : v.m >= bad ? '要注意' : '不良'; cls = v.m >= good ? 'ok' : v.m >= bad ? '' : 'ng'; basis = '高圧受電設備規程 資料の判定目安'; }
    else { lim = c[3]; judge = v.m >= lim ? '目安以上' : '目安未満'; cls = v.m >= lim ? 'ok' : 'ng'; basis = '電気保安協会の目安(法令の基準ではない)'; }
    const tiles = [tile('基準値・目安', na(lim), 'MΩ以上', basis, 'cu'), tile('判定', judge, '', `測定値 ${v.m}MΩ`, cls)];
    if (/^lv/.test(v.cs) && v.leak > 0) tiles.push(tile('漏えい電流', v.leak <= 1 ? '適合' : '不適合', '', `${v.leak}mA(1mA以下)`, v.leak <= 1 ? 'ok' : 'ng'));
    return {
      tiles,
      notes: ['低圧は開閉器・過電流遮断器で区切れる電路ごとに、電線相互間と電路・大地間を測ります。', '高圧ケーブルの判定目安: 5,000Vメガーで5,000MΩ以上は良・500MΩ未満は不良、10,000Vメガーで10,000MΩ以上は良・1,000MΩ未満は不良、シースは1MΩ以上。規程ではこれらは参考程度で、直流漏れ電流測定などで総合判断するよう求めています。', '高圧機器の目安(母線6MΩ・変圧器30MΩ・開閉器等100MΩ)は電気保安協会の資料の値で、公的な基準ではありません。']
    };
  }
});

// ===== 起動 =====
renderTypes();
update();

})();
</script>
